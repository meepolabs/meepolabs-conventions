repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  # rev must match GITLEAKS_VERSION in actions/security-floor/floor.sh.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
  - repo: local
    hooks:
      # The DEC literal opens with a one-character class so this line does
      # not match itself.
      - id: no-internal-ids
        name: no internal ids
        language: pygrep
        types: [text]
        entry: '[A-Za-z0-9]\.f[0-9]+\.[0-9]+|[A-Za-z0-9]-[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+|(?<![A-Za-z0-9])[D]EC-[0-9]{1,3}(?![0-9])'
        exclude: ^tests/id-hook/
